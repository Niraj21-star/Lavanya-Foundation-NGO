<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Debug Test</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        .loading {
            background-color: #d1ecf1;
            border-color: #bee5eb;
            color: #0c5460;
        }
        .warning {
            background-color: #fff3cd;
            border-color: #ffeaa7;
            color: #856404;
        }
        pre {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 12px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Firebase Debug Test</h1>
    
    <div id="firebase-status" class="test-section loading">
        <h3>Firebase Connection Status</h3>
        <p id="status-text">Testing Firebase connection...</p>
    </div>
    
    <div id="collections-test" class="test-section">
        <h3>Collections Test</h3>
        <p id="collections-text">Testing collections...</p>
        <button onclick="testAllCollections()">Test All Collections</button>
    </div>
    
    <div id="website-settings" class="test-section">
        <h3>Website Settings</h3>
        <p id="settings-text">Loading website settings...</p>
        <button onclick="testWebsiteSettings()">Test Website Settings</button>
    </div>
    
    <div id="projects-test" class="test-section">
        <h3>Projects Data</h3>
        <p id="projects-text">Loading projects...</p>
        <button onclick="testProjects()">Test Projects</button>
        <div id="projects-data"></div>
    </div>
    
    <div id="events-test" class="test-section">
        <h3>Events Data</h3>
        <p id="events-text">Loading events...</p>
        <button onclick="testEvents()">Test Events</button>
        <div id="events-data"></div>
    </div>
    
    <div id="products-test" class="test-section">
        <h3>Products Data</h3>
        <p id="products-text">Loading products...</p>
        <button onclick="testProducts()">Test Products</button>
        <div id="products-data"></div>
    </div>

    <div id="manual-test" class="test-section">
        <h3>Manual Collection Test</h3>
        <input type="text" id="collection-name" placeholder="Enter collection name" value="projects">
        <button onclick="testCollection()">Test Collection</button>
        <div id="manual-test-result"></div>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="firebase-init.js"></script>
    <script type="module" src="admin-debug.js"></script>
</body>
</html>
